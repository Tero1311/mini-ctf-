<!DOCTYPE html>
<html lang="en">
<head>

    <title>Secret Page</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <header>
        <h1>🤫 Secret Page</h1>
        <p>You found something that wasn't linked!</p>

    <main>

        <div class="challenge">

            <h2>Congratulations!</h2>

            <p>You discovered the hidden endpoint.</p>

            <!-- FLAG{hidden_endpoints_can_be_found} -->

            <form action="/submit/challenge2" method="POST">

                <input
                    type="text"
                    name="flag"
                    placeholder="Enter the flag"
                    required
                >

                <button type="submit">
                    Submit Flag
                </button>

            </form>

        </div>

        <p>
            <a href="/">← Back to CTF</a>
        </p>

    </main>

</body>
</html>
